name: Build APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      # runner 镜像自带 Android SDK，不再用 android-actions/setup-android
      # （它在装了 cmdline-tools 16 的镜像上会去装已下架的 tools 包，直接失败）
      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed 2>/dev/null | head -20

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      # 仓库里没有 keystore.properties 时，构建脚本会自动退回 debug 签名，
      # 所以没配 secret 也能出包；配了就用正式签名。
      - name: Restore release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.keystore
            {
              echo "keystore.file=release.keystore"
              echo "keystore.password=$KEYSTORE_PASSWORD"
              echo "keystore.key.alias=$KEYSTORE_ALIAS"
              echo "keystore.key.password=$KEYSTORE_KEY_PASSWORD"
            } > keystore.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "未配置 KEYSTORE_BASE64，使用 debug 签名"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: ./gradlew assembleRelease --stacktrace

      # 产出用稳定文件名，这样 /releases/latest/download/<名字> 永远指向最新包，
      # 可以直接当永久下载链接用（原始文件名带 commit sha，每次构建都在变）
      - name: Collect APKs
        run: |
          mkdir -p dist
          for f in $(find app/build/outputs/apk -name '*.apk'); do
            base=$(basename "$f")
            case "$base" in
              *coexist*) cp "$f" "dist/tieba-lite-coexist.apk" ;;
              *)         cp "$f" "dist/tieba-lite-official.apk" ;;
            esac
          done
          ls -l dist
          test -n "$(ls -A dist)" || { echo "没有产出 APK"; exit 1; }

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.sha }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      # Release 说明顶部自动生成下载表格，链接指向 /releases/latest/download/，
      # 也就是说这个链接永远是当前最新版本
      - name: 生成 Release 说明
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          {
            echo "## 下载"
            echo
            echo "| 版本 | 包名 | 下载 |"
            echo "| --- | --- | --- |"
            for f in dist/tieba-lite-*.apk; do
              name=$(basename "$f")
              if [ "$name" = "tieba-lite-coexist.apk" ]; then
                pkg=' com.huanchengfly.tieba.post.coexist '
              else
                pkg=' com.huanchengfly.tieba.post '
              fi
              echo "| \`$name\` | \`$pkg\` | [${{ github.server_url }}/${{ github.repository }}/releases/latest/download/$name](${{ github.server_url }}/${{ github.repository }}/releases/latest/download/$name) |"
            done
            echo
            cat .github/RELEASE_NOTES.md
          } > RELEASE_BODY.md
          echo "---- RELEASE_BODY.md ----"
          cat RELEASE_BODY.md

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_BODY.md
          files: dist/*.apk