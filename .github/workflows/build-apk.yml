name: Build APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      # 仓库里没有 keystore.properties 时，构建脚本会自动退回 debug 签名，
      # 所以没配 secret 也能出包；配了就用正式签名。
      - name: Restore release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.keystore
            {
              echo "keystore.file=release.keystore"
              echo "keystore.password=$KEYSTORE_PASSWORD"
              echo "keystore.key.alias=$KEYSTORE_ALIAS"
              echo "keystore.key.password=$KEYSTORE_KEY_PASSWORD"
            } > keystore.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "未配置 KEYSTORE_BASE64，使用 debug 签名"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: ./gradlew assembleRelease --stacktrace

      - name: Collect APKs
        id: apk
        run: |
          mkdir -p dist
          for f in $(find app/build/outputs/apk -name '*.apk'); do
            cp "$f" "dist/$(basename "$f")"
          done
          ls -l dist
          test -n "$(ls -A dist)" || { echo "没有产出 APK"; exit 1; }

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.sha }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: .github/RELEASE_NOTES.md
          files: dist/*.apk